# Local development. Runs the two backend services against REAL AWS
# resources (DynamoDB, SQS, S3) created by infra-persistent.
#
# Nothing here is used in the cluster. In EKS these services get their AWS
# credentials from Pod Identity and their config from External Secrets; the
# application code is identical, only the credential source differs. That is
# the point of running it this way rather than with LocalStack: the AWS calls
# you debug locally are the same calls the pod makes.
#
# Credentials come from .env.aws, generated by scripts/aws-creds.sh. The
# containers do not mount ~/.aws: profiles using SSO or credential_process
# need the AWS CLI to resolve them, and it is not in the image. Passing
# resolved credentials through the environment also matches how Pod Identity
# supplies them in the cluster.
#
#   ./scripts/aws-creds.sh    refresh credentials (they expire)
#   docker compose up --build

services:
  data-service:
    build:
      context: ./backend/data-service
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.aws
    environment:
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      # botocore's implicit region lookup reads AWS_DEFAULT_REGION; AWS_REGION
      # alone is not enough for a client created without region_name.
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-1}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      RESOURCE_PREFIX: ${RESOURCE_PREFIX:-sdc-lake-dev}
    volumes:
      # Source mounted over the image so edits reload without rebuilding.
      - ./backend/data-service:/app
    # main_dev, not main: authentication is replaced by the X-Dev-User
    # header. The cluster runs `main:app`, which has no such path.
    command: >
      uvicorn main_dev:app
      --host 0.0.0.0 --port 8000 --reload

  provisioning-service:
    build:
      context: ./backend/provisioning-service
    env_file:
      - .env
      - .env.aws
    environment:
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-1}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      RESOURCE_PREFIX: ${RESOURCE_PREFIX:-sdc-lake-dev}
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      POLL_WAIT_SECONDS: "10"
    volumes:
      - ./backend/provisioning-service:/app
