apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: app
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      # Nothing here calls AWS - the frontend only talks to the data service -
      # so it uses the default service account and gets no AWS credentials.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-service
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            # Next.js listens on 3000. The Service maps 80 to it, so callers
            # inside the cluster can use the plain hostname.
            - containerPort: 3000
          env:
            - name: HOSTNAME 
              value: "0.0.0.0"
            - name: DATA_SERVICE_URL
              value: {{ .Values.dataServiceUrl | quote }}
            # Redirects are built from this, never from the incoming request:
            # behind the NLB the request URL carries the pod's own address.
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | quote }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId | quote }}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId | quote }}
            - name: ENTRA_REDIRECT_URI
              value: {{ .Values.entra.redirectUri | quote }}
            - name: ENTRA_POST_LOGOUT_URI
              value: {{ .Values.entra.postLogoutUri | quote }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entra.secretName }}
                  key: {{ .Values.entra.secretKey }}
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next.js writes a cache at runtime, so a read-only root filesystem
            # needs somewhere writable. emptyDir lives and dies with the pod.
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: app
spec:
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 3000
