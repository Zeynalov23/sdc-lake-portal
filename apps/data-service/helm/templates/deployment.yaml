apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: app
spec:
  # No replicas field, deliberately. The HorizontalPodAutoscaler owns this
  # number now. Leaving it here would mean ArgoCD (selfHeal: true) writing 2
  # while the HPA writes whatever load demands - each reverting the other
  # every few seconds, with the pod count oscillating for as long as both
  # are running. Omitting the field is cleaner than an ignoreDifferences
  # rule, because it removes the conflict instead of hiding it.
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      serviceAccountName: data-service
      containers:
        - name: data-service
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          env:
            - name: DYNAMODB_TABLE
              value: {{ .Values.dynamodb.tableName }}
            - name: AWS_REGION
              value: {{ .Values.aws.region }}
            - name: AWS_ACCOUNT_ID
              value: {{ .Values.aws.accountId | quote }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId}}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId}}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdc-lake-entra
                  key: client-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: app
  labels:
    # A ServiceMonitor selects SERVICES by their labels, not pods by theirs.
    # spec.selector below picks the pods; this label is what lets the
    # ServiceMonitor pick this Service.
    app: data-service
spec:
  selector:
    app: data-service
  ports:
    # Named, because a ServiceMonitor selects the port by name. An unnamed
    # port can only be scraped by number, which breaks the moment the port
    # changes.
    - name: http
      port: 80
      targetPort: 8000
