apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      serviceAccountName: data-service
      containers:
        - name: data-service
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          env:
            - name: DYNAMODB_TABLE
              value: {{ .Values.dynamodb.tableName }}
            - name: AWS_REGION
              value: {{ .Values.aws.region }}
            - name: AWS_ACCOUNT_ID
              value: {{ .Values.aws.accountId | quote }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId}}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId}}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdc-lake-entra
                  key: client-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: app
spec:
  selector:
    app: data-service
  ports:
    - port: 80
      targetPort: 8000
