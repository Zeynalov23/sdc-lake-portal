apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 3000
          env:
            - name: DATA_SERVICE_URL
              value: {{ .Values.dataServiceUrl }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId | quote }}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId | quote }}
            - name: ENTRA_REDIRECT_URI
              value: {{ .Values.entra.redirectUri | quote }}
            - name: ENTRA_POST_LOGOUT_URI
              value: {{ .Values.entra.postLogoutUri | quote }}
            # Read from a Secret rather than values.yaml: a value in values is
            # a value in git. Replaced by External Secrets in week 4.
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entra.secretName }}
                  key: {{ .Values.entra.secretKey }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
