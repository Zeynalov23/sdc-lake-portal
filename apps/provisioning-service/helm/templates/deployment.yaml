apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
    spec:
      serviceAccountName: provisioning-service  # linked to Pod Identity
      containers:
        - name: provisioning-service
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: SQS_QUEUE_URL
              value: {{ .Values.sqs.queueUrl }}
            - name: DYNAMODB_TABLE
              value: {{ .Values.dynamodb.tableName }}
            - name: AWS_REGION
              value: {{ .Values.aws.region }}
            - name: AWS_ACCOUNT_ID
              value: {{ .Values.aws.accountId | quote }}
            - name: RESOURCE_PREFIX
              value: {{ .Values.resourcePrefix }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
          - mountPath: /tmp
            name: heartbeat
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60            
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
      - name: heartbeat
        emptyDir:
          sizeLimit: 500Mi    
