apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-app
  namespace: argocd
  annotations:
    # After the platform chart, since the Gateway is what it reads addresses
    # from, but before nothing in particular - records can appear late without
    # harm.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Zeynalov23/sdc-lake-portal.git
    targetRevision: main
    path: apps/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The chart creates its own namespace, so ArgoCD does not need to.
      - CreateNamespace=false
