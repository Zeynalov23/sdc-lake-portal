apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    # Wave 2, and a separate Application on purpose. Sync waves order the
    # apply within one Application, but ArgoCD dry-runs every manifest in an
    # Application before any wave runs - so an ExternalSecret sitting beside
    # the operator that defines its CRD fails validation before the ordering
    # can help. Splitting them means the second sync starts after the first
    # has finished and the CRDs exist.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Zeynalov23/sdc-lake-portal.git
    targetRevision: main
    path: apps/external-secrets-config
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
