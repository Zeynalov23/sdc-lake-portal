apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    # Wave 1: the operator and its CRDs must exist before anything of kind
    # ExternalSecret can even be validated.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    # Straight from the upstream Helm repository - there is nothing to
    # customise, so vendoring a copy of the chart would only create something
    # to keep up to date.
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          # Referenced by the Pod Identity association in infra-cluster.
          create: true
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
